# Builds an UNSIGNED .ipa on a macOS runner. SideStore signs it on the phone
# with your free Apple ID, so no Apple Developer account or secrets are needed.
#
# Run it: GitHub → Actions → "iOS build" → Run workflow (or push a tag like v1.0.0).
# Download: the finished run's "Tend-ipa" artifact (a zip containing Tend.ipa).

name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tend.ipa Payload
          ls -lh Tend.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tend-ipa
          path: Tend.ipa
          retention-days: 30
